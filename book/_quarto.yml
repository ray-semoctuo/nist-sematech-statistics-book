project:
  type: book

book:
  title: "NIST/SEMATECH e-Handbook of Statistical Methods (Tidyverse Edition)"
  subtitle: "Worked examples reproduced in R using the tidyverse"
  editor: "Ray James Hoobler"
  date: today
  repo-url: https://github.com/ray-semoctuo/nist-sematech-statistics-book
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - chapters/01-eda/index.qmd
    - chapters/02-mpc/index.qmd
    - chapters/03-ppc/index.qmd
    - chapters/04-pmd/index.qmd
    - chapters/05-pri/index.qmd
    - chapters/06-pmc/index.qmd
    - chapters/07-prc/index.qmd
    - chapters/08-apr/index.qmd
  appendices:
    - about-the-editor.qmd
    - methodology.qmd
    - acknowledgments.qmd
    - copyright.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
    code-fold: show
    code-tools: true
    toc: true
    toc-depth: 4
    df-print: paged

execute:
  freeze: auto
