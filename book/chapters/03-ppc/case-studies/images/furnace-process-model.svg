<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #dfe7ee; stroke: #1B1B1B; stroke-width: 1.5; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.3; fill: none; marker-end: url(#arrowhead); }
    .title { font-size: 18px; font-weight: bold; fill: #1B1B1B; text-anchor: middle; }
    .label { font-size: 14px; fill: #1B1B1B; text-anchor: start; }
    .label-end { font-size: 14px; fill: #1B1B1B; text-anchor: end; }
    .uncontrolled { font-size: 14px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- Process box -->
  <rect class="box" x="195" y="150" width="230" height="140" />
  <text class="title" x="310" y="205">Furnace</text>
  <text class="title" x="310" y="228">Oxide</text>
  <text class="title" x="310" y="251">Growth</text>

  <!-- Top: uncontrolled factors -->
  <line class="arrow" x1="255" y1="30" x2="255" y2="148" />
  <text class="uncontrolled" x="255" y="22">zone</text>

  <line class="arrow" x1="345" y1="30" x2="345" y2="148" />
  <text class="uncontrolled" x="345" y="22">run</text>

  <!-- Left: controlled inputs -->
  <line class="arrow" x1="60" y1="180" x2="193" y2="180" />
  <text class="label" x="65" y="173">gas flow</text>

  <line class="arrow" x1="60" y1="215" x2="193" y2="215" />
  <text class="label" x="65" y="208">pressure</text>

  <line class="arrow" x1="60" y1="250" x2="193" y2="250" />
  <text class="label" x="65" y="243">temp</text>

  <line class="arrow" x1="60" y1="285" x2="193" y2="285" />
  <text class="label" x="65" y="278">time</text>

  <!-- Right: output -->
  <line class="arrow" x1="427" y1="220" x2="580" y2="220" />
  <text class="label-end" x="575" y="213">Film Thickness</text>
</svg>
