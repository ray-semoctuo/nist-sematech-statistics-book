<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Helvetica, Arial, sans-serif">
  <style>
    .spine { stroke: #1B1B1B; stroke-width: 1.8; fill: none; }
    .bone { stroke: #1B1B1B; stroke-width: 1.5; fill: none; }
    .tick { stroke: #1B1B1B; stroke-width: 1.2; fill: none; }
    .category { font-size: 15px; font-weight: bold; fill: #1B1B1B; text-anchor: middle; }
    .cause-r { font-size: 12px; fill: #1B1B1B; text-anchor: start; }
    .cause-l { font-size: 12px; fill: #1B1B1B; text-anchor: end; }
    .head-label { font-size: 15px; font-weight: bold; fill: #1B1B1B; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- Spine -->
  <line class="spine" x1="30" y1="210" x2="470" y2="210" marker-end="url(#arrowhead)" />
  <text class="head-label" x="485" y="215">Diameter</text>

  <!-- Machine (top-left): Lead Screws, Ways, Tool Wear -->
  <text class="category" x="70" y="32">Machine</text>
  <line class="bone" x1="70" y1="50" x2="200" y2="210" />
  <!-- bone: x = 70 + 130*(y-50)/160 -->
  <line class="tick" x1="110.6" y1="100" x2="132.6" y2="100" />
  <text class="cause-r" x="136.6" y="104">Lead Screws</text>
  <line class="tick" x1="121.1" y1="140" x2="143.1" y2="140" />
  <text class="cause-l" x="117.1" y="144">Ways</text>
  <line class="tick" x1="175.6" y1="180" x2="197.6" y2="180" />
  <text class="cause-r" x="201.6" y="184">Tool Wear</text>

  <!-- Material (top-right): Bar Stock, Coolant -->
  <text class="category" x="260" y="32">Material</text>
  <line class="bone" x1="260" y1="50" x2="390" y2="210" />
  <!-- bone: x = 260 + 130*(y-50)/160 -->
  <line class="tick" x1="300.6" y1="100" x2="322.6" y2="100" />
  <text class="cause-r" x="326.6" y="104">Bar Stock</text>
  <line class="tick" x1="327.4" y1="160" x2="349.4" y2="160" />
  <text class="cause-l" x="323.4" y="164">Coolant</text>

  <!-- Measurement (bottom-left): Calibration, Operator -->
  <text class="category" x="70" y="405">Measurement</text>
  <line class="bone" x1="70" y1="380" x2="200" y2="210" />
  <!-- bone: x = 70 + 130*(380-y)/170 -->
  <line class="tick" x1="131.2" y1="300" x2="153.2" y2="300" />
  <text class="cause-r" x="157.2" y="304">Calibration</text>
  <line class="tick" x1="147.4" y1="250" x2="169.4" y2="250" />
  <text class="cause-l" x="143.4" y="254">Operator</text>

  <!-- Method (bottom-right): Speed/Feed, Stops, Wear Offset -->
  <text class="category" x="260" y="405">Method</text>
  <line class="bone" x1="260" y1="380" x2="390" y2="210" />
  <!-- bone: x = 260 + 130*(380-y)/170 -->
  <line class="tick" x1="305.9" y1="320" x2="327.9" y2="320" />
  <text class="cause-r" x="331.9" y="324">Speed / Feed</text>
  <line class="tick" x1="314.5" y1="280" x2="336.5" y2="280" />
  <text class="cause-l" x="310.5" y="284">Stops</text>
  <line class="tick" x1="367.1" y1="240" x2="389.1" y2="240" />
  <text class="cause-r" x="393.1" y="244">Wear Offset</text>

</svg>
