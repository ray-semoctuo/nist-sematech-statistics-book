<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #dfe7ee; stroke: #1B1B1B; stroke-width: 1.5; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.3; fill: none; marker-end: url(#arrowhead); }
    .title { font-size: 20px; font-weight: bold; fill: #1B1B1B; text-anchor: middle; }
    .label { font-size: 14px; font-weight: bold; fill: #00105A; text-anchor: middle; }
    .sublabel { font-size: 11px; fill: #1B1B1B; text-anchor: middle; }
    .num { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
    .dots { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- Process box -->
  <rect class="box" x="230" y="190" width="220" height="220" />
  <text class="title" x="340" y="308">Process</text>

  <!-- Top: uncontrolled, discrete inputs -->
  <text class="label" x="340" y="22">Uncontrolled Inputs</text>
  <text class="label" x="340" y="40">(Co-Factors)</text>

  <line class="arrow" x1="270" y1="55" x2="270" y2="168" />
  <text class="sublabel" x="256" y="112" transform="rotate(-90 256 112)">Raw Material Variation</text>

  <line class="arrow" x1="340" y1="55" x2="340" y2="168" />
  <text class="sublabel" x="326" y="112" transform="rotate(-90 326 112)">Different Machines</text>

  <line class="arrow" x1="410" y1="55" x2="410" y2="168" />
  <text class="sublabel" x="396" y="112" transform="rotate(-90 396 112)">Different Operators</text>

  <text class="sublabel" x="340" y="182">Discrete</text>

  <!-- Bottom: uncontrolled, continuous inputs -->
  <line class="arrow" x1="270" y1="590" x2="270" y2="432" />
  <text class="sublabel" x="256" y="511" transform="rotate(-90 256 511)">Room Temperature</text>

  <line class="arrow" x1="340" y1="590" x2="340" y2="432" />
  <text class="sublabel" x="326" y="511" transform="rotate(-90 326 511)">Controller Drift</text>

  <line class="arrow" x1="410" y1="590" x2="410" y2="432" />
  <text class="sublabel" x="396" y="511" transform="rotate(-90 396 511)">Cryo Pump Variation</text>

  <text class="sublabel" x="340" y="426">Continuous</text>

  <!-- Left: controlled inputs (factors) -->
  <text class="label" x="90" y="150">Controlled Inputs</text>
  <text class="label" x="90" y="168">(Factors)</text>

  <line class="arrow" x1="100" y1="230" x2="228" y2="230" />
  <text class="num" x="115" y="222">1</text>
  <line class="arrow" x1="100" y1="265" x2="228" y2="265" />
  <text class="num" x="115" y="257">2</text>
  <line class="arrow" x1="100" y1="300" x2="228" y2="300" />
  <text class="num" x="115" y="292">3</text>
  <text class="dots" x="115" y="325">.</text>
  <text class="dots" x="115" y="335">.</text>
  <text class="dots" x="115" y="345">.</text>
  <line class="arrow" x1="100" y1="375" x2="228" y2="375" />
  <text class="num" x="115" y="367">n</text>

  <!-- Right: outputs (responses) -->
  <text class="label" x="595" y="150">Outputs</text>
  <text class="label" x="595" y="168">(Responses)</text>

  <line class="arrow" x1="452" y1="230" x2="580" y2="230" />
  <text class="num" x="565" y="222">1</text>
  <line class="arrow" x1="452" y1="265" x2="580" y2="265" />
  <text class="num" x="565" y="257">2</text>
  <line class="arrow" x1="452" y1="300" x2="580" y2="300" />
  <text class="num" x="565" y="292">3</text>
  <text class="dots" x="565" y="325">.</text>
  <text class="dots" x="565" y="335">.</text>
  <text class="dots" x="565" y="345">.</text>
  <line class="arrow" x1="452" y1="375" x2="580" y2="375" />
  <text class="num" x="565" y="367">n</text>

</svg>
