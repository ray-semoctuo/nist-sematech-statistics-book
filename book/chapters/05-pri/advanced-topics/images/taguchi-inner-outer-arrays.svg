<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -15 475 405" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-black" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1B1B1B" />
    </marker>
  </defs>
  <style>
    .cube-face { fill: none; stroke: #1B1B1B; stroke-width: 1.2; }
    .cube-edge { stroke: #1B1B1B; stroke-width: 1.2; fill: none; }
    .outer-sq { fill: none; stroke: #1B1B1B; stroke-width: 1; }
    .dot { fill: #1B1B1B; }
    .axis-arrow { stroke: #1B1B1B; stroke-width: 1.3; fill: none; }
    .axis-lbl { font-size: 15px; font-style: italic; fill: #1B1B1B; }
  </style>

  <!-- big 2^3 inner-array cube (front and back faces) -->
  <polygon class="cube-face" points="176,77 377,77 377,261 176,261" />
  <polygon class="cube-face" points="88,133 289,133 289,321 88,321" />
  <line class="cube-edge" x1="176" y1="77" x2="88" y2="133" />
  <line class="cube-edge" x1="377" y1="77" x2="289" y2="133" />
  <line class="cube-edge" x1="176" y1="261" x2="88" y2="321" />
  <line class="cube-edge" x1="377" y1="261" x2="289" y2="321" />

  <!-- small 2^2 outer-array square at each of the 8 inner-array vertices -->
  <polygon class="outer-sq" points="156,57 196,57 196,97 156,97" />
  <circle class="dot" cx="156" cy="57" r="3.5" /><circle class="dot" cx="196" cy="57" r="3.5" />
  <circle class="dot" cx="156" cy="97" r="3.5" /><circle class="dot" cx="196" cy="97" r="3.5" />

  <polygon class="outer-sq" points="357,57 397,57 397,97 357,97" />
  <circle class="dot" cx="357" cy="57" r="3.5" /><circle class="dot" cx="397" cy="57" r="3.5" />
  <circle class="dot" cx="357" cy="97" r="3.5" /><circle class="dot" cx="397" cy="97" r="3.5" />

  <polygon class="outer-sq" points="156,241 196,241 196,281 156,281" />
  <circle class="dot" cx="156" cy="241" r="3.5" /><circle class="dot" cx="196" cy="241" r="3.5" />
  <circle class="dot" cx="156" cy="281" r="3.5" /><circle class="dot" cx="196" cy="281" r="3.5" />

  <polygon class="outer-sq" points="357,241 397,241 397,281 357,281" />
  <circle class="dot" cx="357" cy="241" r="3.5" /><circle class="dot" cx="397" cy="241" r="3.5" />
  <circle class="dot" cx="357" cy="281" r="3.5" /><circle class="dot" cx="397" cy="281" r="3.5" />

  <polygon class="outer-sq" points="68,113 108,113 108,153 68,153" />
  <circle class="dot" cx="68" cy="113" r="3.5" /><circle class="dot" cx="108" cy="113" r="3.5" />
  <circle class="dot" cx="68" cy="153" r="3.5" /><circle class="dot" cx="108" cy="153" r="3.5" />

  <polygon class="outer-sq" points="269,113 309,113 309,153 269,153" />
  <circle class="dot" cx="269" cy="113" r="3.5" /><circle class="dot" cx="309" cy="113" r="3.5" />
  <circle class="dot" cx="269" cy="153" r="3.5" /><circle class="dot" cx="309" cy="153" r="3.5" />

  <polygon class="outer-sq" points="68,301 108,301 108,341 68,341" />
  <circle class="dot" cx="68" cy="301" r="3.5" /><circle class="dot" cx="108" cy="301" r="3.5" />
  <circle class="dot" cx="68" cy="341" r="3.5" /><circle class="dot" cx="108" cy="341" r="3.5" />

  <polygon class="outer-sq" points="269,301 309,301 309,341 269,341" />
  <circle class="dot" cx="269" cy="301" r="3.5" /><circle class="dot" cx="309" cy="301" r="3.5" />
  <circle class="dot" cx="269" cy="341" r="3.5" /><circle class="dot" cx="309" cy="341" r="3.5" />

  <!-- legend: small outer-array orientation (E1 up, E2 right) -->
  <line class="axis-arrow" x1="0" y1="40" x2="0" y2="15" marker-end="url(#arrow-black)" />
  <line class="axis-arrow" x1="0" y1="40" x2="25" y2="40" marker-end="url(#arrow-black)" />
  <text class="axis-lbl" x="-14" y="18">E1</text>
  <text class="axis-lbl" x="30" y="44">E2</text>

  <!-- inner-array axis labels -->
  <line class="axis-arrow" x1="40" y1="300" x2="40" y2="245" marker-end="url(#arrow-black)" />
  <text class="axis-lbl" x="25" y="235">I1</text>

  <line class="axis-arrow" x1="118" y1="321" x2="265" y2="321" marker-end="url(#arrow-black)" />
  <text class="axis-lbl" x="128" y="337">I2</text>

  <line class="axis-arrow" x1="45" y1="300" x2="83" y2="258" marker-end="url(#arrow-black)" />
  <text class="axis-lbl" x="48" y="280">I3</text>
</svg>
