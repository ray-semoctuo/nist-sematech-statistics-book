<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { stroke: #1B1B1B; stroke-width: 1; fill: none; stroke-dasharray: 4,3; }
    .pt { fill: #00105A; }
    .lbl { font-size: 11px; fill: #1B1B1B; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- initial factorial experiment (dashed box, bottom-left) -->
  <rect class="box" x="40" y="190" width="60" height="45" />
  <circle class="pt" cx="40" cy="235" r="3.5" />
  <circle class="pt" cx="100" cy="235" r="3.5" />
  <circle class="pt" cx="40" cy="190" r="3.5" />
  <circle class="pt" cx="100" cy="190" r="3.5" />
  <circle class="pt" cx="70" cy="212.5" r="3.5" />
  <text class="lbl" x="20" y="255">Initial factorial experiment</text>
  <text class="lbl" x="20" y="268">with center runs</text>

  <!-- first step: line search from center of first box to center of second box -->
  <line class="arrow" x1="70" y1="212.5" x2="255" y2="107.5" />
  <text class="lbl" x="110" y="175">first step size</text>

  <!-- second factorial experiment (dashed box, middle) -->
  <rect class="box" x="225" y="85" width="60" height="45" />
  <circle class="pt" cx="225" cy="130" r="3.5" />
  <circle class="pt" cx="285" cy="130" r="3.5" />
  <circle class="pt" cx="225" cy="85" r="3.5" />
  <circle class="pt" cx="285" cy="85" r="3.5" />
  <circle class="pt" cx="255" cy="107.5" r="3.5" />
  <text class="lbl" x="150" y="53">Second factorial experiment</text>
  <text class="lbl" x="150" y="65">with center runs (gives new direction)</text>

  <!-- new direction arrow continuing up-right -->
  <line class="arrow" x1="255" y1="107.5" x2="380" y2="60" />
  <text class="lbl" x="385" y="45">direction</text>
  <text class="lbl" x="278" y="118">second step size</text>

  <!-- second search direction, descending toward third experiment -->
  <line class="arrow" x1="380" y1="60" x2="530" y2="200" />
  <text class="lbl" x="440" y="150">second search</text>
  <text class="lbl" x="440" y="163">direction</text>

  <!-- third factorial experiment (dashed box, bottom-right) -->
  <rect class="box" x="500" y="177" width="60" height="45" />
  <circle class="pt" cx="500" cy="222" r="3.5" />
  <circle class="pt" cx="560" cy="222" r="3.5" />
  <circle class="pt" cx="500" cy="177" r="3.5" />
  <circle class="pt" cx="560" cy="177" r="3.5" />
  <circle class="pt" cx="530" cy="199.5" r="3.5" />
  <text class="lbl" x="440" y="248">Third factorial experiment with center</text>
  <text class="lbl" x="440" y="261">runs (lack of linear fit detected;</text>
  <text class="lbl" x="440" y="274">proceed with Phase II)</text>
</svg>
