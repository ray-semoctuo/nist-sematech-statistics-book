<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" font-family="Helvetica, Arial, sans-serif">
  <style>
    .edge { stroke: #1B1B1B; stroke-width: 1.5; fill: none; }
    .edge-hidden { stroke: #1B1B1B; stroke-width: 1.2; fill: none; stroke-dasharray: 5,4; }
    .point { fill: #00105A; stroke: #00105A; }
  </style>

  <!-- back face (node 5 is the hidden corner) -->
  <line class="edge-hidden" x1="130" y1="255" x2="130" y2="95" />
  <line class="edge-hidden" x1="130" y1="255" x2="290" y2="255" />
  <line class="edge" x1="130" y1="95" x2="290" y2="95" />
  <line class="edge" x1="290" y1="255" x2="290" y2="95" />

  <!-- connecting edges between front and back faces -->
  <line class="edge-hidden" x1="70" y1="300" x2="130" y2="255" />
  <line class="edge" x1="70" y1="140" x2="130" y2="95" />
  <line class="edge" x1="230" y1="300" x2="290" y2="255" />
  <line class="edge" x1="230" y1="140" x2="290" y2="95" />

  <!-- front face -->
  <line class="edge" x1="70" y1="300" x2="70" y2="140" />
  <line class="edge" x1="70" y1="300" x2="230" y2="300" />
  <line class="edge" x1="70" y1="140" x2="230" y2="140" />
  <line class="edge" x1="230" y1="300" x2="230" y2="140" />

  <!-- 12 edge-midpoint design points, each an exact edge midpoint -->
  <circle class="point" cx="70" cy="220" r="8" />
  <circle class="point" cx="150" cy="300" r="8" />
  <circle class="point" cx="150" cy="140" r="8" />
  <circle class="point" cx="230" cy="220" r="8" />
  <circle class="point" cx="130" cy="175" r="8" />
  <circle class="point" cx="210" cy="255" r="8" />
  <circle class="point" cx="210" cy="95" r="8" />
  <circle class="point" cx="290" cy="175" r="8" />
  <circle class="point" cx="100" cy="277.5" r="8" />
  <circle class="point" cx="100" cy="117.5" r="8" />
  <circle class="point" cx="260" cy="277.5" r="8" />
  <circle class="point" cx="260" cy="117.5" r="8" />

  <!-- center point -->
  <circle class="point" cx="180" cy="197.5" r="8" />

</svg>
