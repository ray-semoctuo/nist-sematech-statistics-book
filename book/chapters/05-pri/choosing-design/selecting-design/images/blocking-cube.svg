<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" font-family="Helvetica, Arial, sans-serif">
  <style>
    .edge { stroke: #1B1B1B; stroke-width: 1.5; fill: none; }
    .edge-hidden { stroke: #1B1B1B; stroke-width: 1.2; fill: none; stroke-dasharray: 5,4; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
    .node-open { fill: white; stroke: #1B1B1B; stroke-width: 1.5; }
    .node-block { fill: #1B1B1B; stroke: #1B1B1B; stroke-width: 1.5; }
    .num { font-size: 15px; fill: #1B1B1B; text-anchor: middle; }
    .label { font-size: 16px; font-weight: bold; fill: #00105A; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- back face (node 5 is the hidden corner) -->
  <line class="edge-hidden" x1="150" y1="240" x2="150" y2="100" />
  <line class="edge-hidden" x1="150" y1="240" x2="310" y2="240" />
  <line class="edge" x1="150" y1="100" x2="310" y2="100" />
  <line class="edge" x1="310" y1="240" x2="310" y2="100" />

  <!-- connecting edges between front and back faces -->
  <line class="edge-hidden" x1="70" y1="300" x2="150" y2="240" />
  <line class="edge" x1="70" y1="160" x2="150" y2="100" />
  <line class="edge" x1="230" y1="300" x2="310" y2="240" />
  <line class="edge" x1="230" y1="160" x2="310" y2="100" />

  <!-- front face -->
  <line class="edge" x1="70" y1="300" x2="70" y2="160" />
  <line class="edge" x1="70" y1="300" x2="230" y2="300" />
  <line class="edge" x1="70" y1="160" x2="230" y2="160" />
  <line class="edge" x1="230" y1="300" x2="230" y2="160" />

  <!-- factor arrows, drawn beside node 1 in the direction of each axis -->
  <line class="arrow" x1="35" y1="345" x2="35" y2="230" />
  <line class="arrow" x1="15" y1="365" x2="130" y2="365" />
  <line class="arrow" x1="15" y1="345" x2="95" y2="285" />

  <text class="label" x="18" y="215">X1</text>
  <text class="label" x="145" y="358">X2</text>
  <text class="label" x="95" y="265">X3</text>

  <!-- nodes, numbered per Standard Order; filled = Block II, open = Block I -->
  <circle class="node-open" cx="70" cy="300" r="13" />
  <text class="num" x="55" y="325">1</text>

  <circle class="node-block" cx="70" cy="160" r="13" />
  <text class="num" x="55" y="150">2</text>

  <circle class="node-block" cx="230" cy="300" r="13" />
  <text class="num" x="230" y="325">3</text>

  <circle class="node-open" cx="230" cy="160" r="13" />
  <text class="num" x="230" y="140">4</text>

  <circle class="node-block" cx="150" cy="240" r="13" />
  <text class="num" x="150" y="265">5</text>

  <circle class="node-open" cx="150" cy="100" r="13" />
  <text class="num" x="150" y="80">6</text>

  <circle class="node-open" cx="310" cy="240" r="13" />
  <text class="num" x="330" y="245">7</text>

  <circle class="node-block" cx="310" cy="100" r="13" />
  <text class="num" x="330" y="90">8</text>

</svg>
