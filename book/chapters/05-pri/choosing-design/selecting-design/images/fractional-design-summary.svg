<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #1B1B1B; stroke-width: 2; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.3; fill: none; marker-end: url(#arrowhead); }
    .callout { font-size: 13px; fill: #1B1B1B; text-anchor: middle; }
    .value { font-size: 24px; font-weight: bold; fill: #00105A; text-anchor: middle; }
    .expr { font-size: 30px; fill: #1B1B1B; }
    .exp { font-size: 16px; fill: #1B1B1B; }
    .gen { font-size: 18px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="6.4" markerHeight="6.4" refX="4.8" refY="3.2" orient="auto">
      <path d="M0,0 L6.4,3.2 L0,6.4 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- main design box (smaller than before) -->
  <rect class="box" x="130" y="100" width="220" height="160" />

  <!-- expression 2^(3-1) inside box, top-left; exponent set tight against the base -->
  <text class="expr" x="150" y="160">2</text>
  <text class="exp" x="167" y="145">3-1</text>

  <!-- design generator inside box, near bottom -->
  <text class="gen" x="280" y="235">&#177; 3=12</text>
  <text class="callout" x="280" y="315">Design</text>
  <text class="callout" x="280" y="330">Generator(s)</text>
  <line class="arrow" x1="280" y1="295" x2="280" y2="248" />

  <!-- number of levels callout (points at the "2") -->
  <text class="callout" x="60" y="70">number of</text>
  <text class="callout" x="60" y="85">levels</text>
  <line class="arrow" x1="78" y1="90" x2="145" y2="148" />

  <!-- extent of fractionation callout (points at the "3-1" exponent) -->
  <text class="callout" x="175" y="40">extent of</text>
  <text class="callout" x="175" y="55">fractionation</text>
  <line class="arrow" x1="178" y1="60" x2="179" y2="128" />

  <!-- number of factors callout, value 3 floats above the top edge -->
  <text class="value" x="228" y="87">3</text>
  <text class="callout" x="315" y="55">number of</text>
  <text class="callout" x="315" y="70">factors</text>
  <line class="arrow" x1="291" y1="60" x2="243" y2="80" />

  <!-- number of runs callout, value 4 floats left of the left edge -->
  <text class="value" x="100" y="182">4</text>
  <text class="callout" x="45" y="207">number</text>
  <text class="callout" x="45" y="222">of runs</text>
  <line class="arrow" x1="68" y1="200" x2="89" y2="185" />

</svg>
