<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #1B1B1B; stroke-width: 2; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.3; fill: none; marker-end: url(#arrowhead); }
    .callout { font-size: 13px; fill: #1B1B1B; text-anchor: middle; }
    .value { font-size: 16px; font-weight: bold; fill: #00105A; text-anchor: middle; }
    .expr { font-size: 26px; fill: #1B1B1B; }
    .gen { font-size: 17px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="6.4" markerHeight="6.4" refX="4.8" refY="3.2" orient="auto">
      <path d="M0,0 L6.4,3.2 L0,6.4 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- main design box -->
  <rect class="box" x="110" y="90" width="300" height="220" />

  <!-- expression 2^(3-1) inside box, top-left -->
  <text class="expr" x="140" y="150">2<tspan baseline-shift="30%" font-size="16">3-1</tspan></text>

  <!-- design generator inside box, bottom-right -->
  <text class="gen" x="330" y="270">&#177; 3=12</text>
  <text class="callout" x="330" y="300">Design Generator(s)</text>
  <line class="arrow" x1="330" y1="288" x2="330" y2="278" />

  <!-- number of levels callout (points at the base "2") -->
  <text class="callout" x="50" y="60">number of</text>
  <text class="callout" x="50" y="75">levels</text>
  <line class="arrow" x1="70" y1="82" x2="135" y2="128" />

  <!-- extent of fractionation callout (points at the "3-1" exponent) -->
  <text class="callout" x="210" y="35">extent of</text>
  <text class="callout" x="210" y="50">fractionation</text>
  <line class="arrow" x1="210" y1="58" x2="188" y2="112" />

  <!-- number of factors callout, top-right, value 3 -->
  <text class="value" x="400" y="55">3</text>
  <text class="callout" x="400" y="75">number of</text>
  <text class="callout" x="400" y="90">factors</text>
  <line class="arrow" x1="392" y1="60" x2="345" y2="100" />

  <!-- number of runs callout, bottom-left, value 4 -->
  <text class="value" x="45" y="345">4</text>
  <text class="callout" x="45" y="365">number</text>
  <text class="callout" x="45" y="380">of runs</text>
  <line class="arrow" x1="60" y1="340" x2="108" y2="300" />

</svg>
