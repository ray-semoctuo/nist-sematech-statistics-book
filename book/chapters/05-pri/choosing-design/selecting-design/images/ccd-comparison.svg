<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 460" font-family="Helvetica, Arial, sans-serif">
  <style>
    .axis { stroke: #888; stroke-width: 1; }
    .edge { stroke: #1B1B1B; stroke-width: 1.3; fill: none; }
    .circle { fill: none; stroke: #1B1B1B; stroke-width: 1.3; }
    .factorial { fill: #00105A; stroke: #00105A; }
    .star { fill: #B22222; stroke: #B22222; stroke-linejoin: round; }
    .label { font-size: 15px; font-weight: bold; fill: #1B1B1B; text-anchor: end; }
    .tick { font-size: 13px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <defs>
    <polygon id="starShape" points="0.00,-9.00 2.06,-2.83 8.56,-2.78 3.33,1.08 5.29,7.28 0.00,3.50 -5.29,7.28 -3.33,1.08 -8.56,-2.78 -2.06,-2.83" />
  </defs>

  <!-- shared vertical axes at the design's -1/+1 factor settings -->
  <line class="axis" x1="80" y1="10" x2="80" y2="430" />
  <line class="axis" x1="170" y1="10" x2="170" y2="430" />
  <text class="tick" x="80" y="22">-1</text>
  <text class="tick" x="170" y="22">+1</text>

  <!-- CCC panel: factorial square corners sit on the -1/+1 lines; star points
       extend beyond them, at the same radius as the corners (63.6 = 45*sqrt(2)) -->
  <g>
    <circle class="circle" cx="125" cy="90" r="63.6" />
    <rect class="edge" x="80" y="45" width="90" height="90" />
    <circle class="factorial" cx="80" cy="45" r="6" />
    <circle class="factorial" cx="170" cy="45" r="6" />
    <circle class="factorial" cx="80" cy="135" r="6" />
    <circle class="factorial" cx="170" cy="135" r="6" />
    <use href="#starShape" class="star" transform="translate(125,26.4)" />
    <use href="#starShape" class="star" transform="translate(125,153.6)" />
    <use href="#starShape" class="star" transform="translate(61.4,90)" />
    <use href="#starShape" class="star" transform="translate(188.6,90)" />
    <text class="label" x="45" y="95">CCC</text>
  </g>

  <!-- CCF panel: same factorial square as CCC, but star points sit at the
       midpoint of each face (on the -1/+1 lines); no circle -->
  <g transform="translate(0,140)">
    <rect class="edge" x="80" y="45" width="90" height="90" />
    <circle class="factorial" cx="80" cy="45" r="6" />
    <circle class="factorial" cx="170" cy="45" r="6" />
    <circle class="factorial" cx="80" cy="135" r="6" />
    <circle class="factorial" cx="170" cy="135" r="6" />
    <use href="#starShape" class="star" transform="translate(125,45)" />
    <use href="#starShape" class="star" transform="translate(125,135)" />
    <use href="#starShape" class="star" transform="translate(80,90)" />
    <use href="#starShape" class="star" transform="translate(170,90)" />
    <text class="label" x="45" y="95">CCF</text>
  </g>

  <!-- CCI panel: star points sit on the -1/+1 lines (the specified limits);
       the factorial square is CCC's square scaled down by 1/sqrt(2), so its
       corners land on the same circle (r=45) as the star points -->
  <g transform="translate(0,260)">
    <circle class="circle" cx="125" cy="90" r="45" />
    <rect class="edge" x="93.2" y="58.2" width="63.6" height="63.6" />
    <circle class="factorial" cx="93.2" cy="58.2" r="6" />
    <circle class="factorial" cx="156.8" cy="58.2" r="6" />
    <circle class="factorial" cx="93.2" cy="121.8" r="6" />
    <circle class="factorial" cx="156.8" cy="121.8" r="6" />
    <use href="#starShape" class="star" transform="translate(125,45)" />
    <use href="#starShape" class="star" transform="translate(125,135)" />
    <use href="#starShape" class="star" transform="translate(80,90)" />
    <use href="#starShape" class="star" transform="translate(170,90)" />
    <text class="label" x="45" y="95">CCI</text>
  </g>
</svg>
