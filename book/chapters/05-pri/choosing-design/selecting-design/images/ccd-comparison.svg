<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .axis { stroke: #888; stroke-width: 1; }
    .edge { stroke: #1B1B1B; stroke-width: 1.3; fill: none; }
    .circle { fill: none; stroke: #1B1B1B; stroke-width: 1.3; }
    .factorial { fill: #00105A; stroke: #00105A; }
    .star { fill: #B22222; stroke: #B22222; }
    .label { font-size: 15px; font-weight: bold; fill: #1B1B1B; text-anchor: end; }
    .tick { font-size: 13px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <!-- shared vertical axes -->
  <line class="axis" x1="80" y1="10" x2="80" y2="550" />
  <line class="axis" x1="170" y1="10" x2="170" y2="550" />
  <text class="tick" x="80" y="22">-1</text>
  <text class="tick" x="170" y="22">+1</text>

  <!-- CCC panel -->
  <g>
    <circle class="circle" cx="125" cy="90" r="63" />
    <rect class="edge" x="80" y="55" width="90" height="70" />
    <circle class="factorial" cx="80" cy="55" r="6" />
    <circle class="factorial" cx="170" cy="55" r="6" />
    <circle class="factorial" cx="80" cy="125" r="6" />
    <circle class="factorial" cx="170" cy="125" r="6" />
    <rect class="star" x="119" y="21" width="12" height="12" />
    <rect class="star" x="119" y="153" width="12" height="12" />
    <rect class="star" x="15" y="84" width="12" height="12" />
    <rect class="star" x="223" y="84" width="12" height="12" />
    <text class="label" x="55" y="94">CCC</text>
  </g>

  <!-- CCF panel -->
  <g transform="translate(0,190)">
    <rect class="edge" x="80" y="55" width="90" height="70" />
    <circle class="factorial" cx="80" cy="55" r="6" />
    <circle class="factorial" cx="170" cy="55" r="6" />
    <circle class="factorial" cx="80" cy="125" r="6" />
    <circle class="factorial" cx="170" cy="125" r="6" />
    <rect class="star" x="119" y="49" width="12" height="12" />
    <rect class="star" x="119" y="119" width="12" height="12" />
    <rect class="star" x="74" y="84" width="12" height="12" />
    <rect class="star" x="164" y="84" width="12" height="12" />
    <text class="label" x="55" y="94">CCF</text>
  </g>

  <!-- CCI panel -->
  <g transform="translate(0,380)">
    <circle class="circle" cx="125" cy="90" r="45" />
    <rect class="edge" x="80" y="55" width="90" height="70" />
    <circle class="factorial" cx="107" cy="72" r="6" />
    <circle class="factorial" cx="143" cy="72" r="6" />
    <circle class="factorial" cx="107" cy="108" r="6" />
    <circle class="factorial" cx="143" cy="108" r="6" />
    <rect class="star" x="119" y="39" width="12" height="12" />
    <rect class="star" x="119" y="135" width="12" height="12" />
    <rect class="star" x="59" y="84" width="12" height="12" />
    <rect class="star" x="191" y="84" width="12" height="12" />
    <text class="label" x="55" y="94">CCI</text>
  </g>
</svg>
