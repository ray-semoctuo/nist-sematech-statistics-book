<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 470" font-family="Helvetica, Arial, sans-serif">
  <style>
    .edge { stroke: #1B1B1B; stroke-width: 1.3; fill: none; }
    .factorial { fill: #00105A; stroke: #00105A; }
    .star { fill: #B22222; stroke: #B22222; stroke-linejoin: round; }
    .center { fill: #1B1B1B; }
    .plus { font-size: 26px; fill: #1B1B1B; text-anchor: middle; }
    .circle { fill: none; stroke: #1B1B1B; stroke-width: 1.3; }
  </style>

  <defs>
    <polygon id="starShape" points="0.00,-9.00 2.06,-2.83 8.56,-2.78 3.33,1.08 5.29,7.28 0.00,3.50 -5.29,7.28 -3.33,1.08 -8.56,-2.78 -2.06,-2.83" />
  </defs>

  <!-- left: factorial square -->
  <rect class="edge" x="30" y="30" width="90" height="90" />
  <circle class="factorial" cx="30" cy="30" r="7" />
  <circle class="factorial" cx="120" cy="30" r="7" />
  <circle class="factorial" cx="30" cy="120" r="7" />
  <circle class="factorial" cx="120" cy="120" r="7" />
  <circle class="center" cx="75" cy="75" r="4" />

  <text class="plus" x="150" y="85">+</text>

  <!-- right: star points -->
  <line class="edge" x1="180" y1="75" x2="300" y2="75" />
  <line class="edge" x1="240" y1="15" x2="240" y2="135" />
  <use href="#starShape" class="star" transform="translate(180,75)" />
  <use href="#starShape" class="star" transform="translate(300,75)" />
  <use href="#starShape" class="star" transform="translate(240,15)" />
  <use href="#starShape" class="star" transform="translate(240,135)" />
  <circle class="center" cx="240" cy="75" r="4" />

  <text class="plus" x="150" y="195">=</text>

  <!-- combined design: square corners set at radius 80 (80/sqrt(2) offset from center) so they fall exactly on the same circle as the star points -->
  <g transform="translate(0,240)">
    <rect class="edge" x="108.4" y="18.4" width="113.1" height="113.1" />
    <circle class="circle" cx="165" cy="75" r="80" />
    <circle class="factorial" cx="108.4" cy="18.4" r="7" />
    <circle class="factorial" cx="221.5" cy="18.4" r="7" />
    <circle class="factorial" cx="108.4" cy="131.5" r="7" />
    <circle class="factorial" cx="221.5" cy="131.5" r="7" />
    <line class="edge" x1="85" y1="75" x2="245" y2="75" />
    <line class="edge" x1="165" y1="-5" x2="165" y2="155" />
    <use href="#starShape" class="star" transform="translate(85,75)" />
    <use href="#starShape" class="star" transform="translate(245,75)" />
    <use href="#starShape" class="star" transform="translate(165,-5)" />
    <use href="#starShape" class="star" transform="translate(165,155)" />
    <circle class="center" cx="165" cy="75" r="4" />
  </g>
</svg>
