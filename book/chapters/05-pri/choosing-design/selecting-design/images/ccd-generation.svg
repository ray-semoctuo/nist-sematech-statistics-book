<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .edge { stroke: #1B1B1B; stroke-width: 1.3; fill: none; }
    .factorial { fill: #00105A; stroke: #00105A; }
    .star { fill: #B22222; stroke: #B22222; }
    .center { fill: #1B1B1B; }
    .plus { font-size: 26px; fill: #1B1B1B; text-anchor: middle; }
    .circle { fill: none; stroke: #1B1B1B; stroke-width: 1.3; }
  </style>

  <!-- left: factorial square -->
  <rect class="edge" x="30" y="30" width="90" height="90" />
  <circle class="factorial" cx="30" cy="30" r="6" />
  <circle class="factorial" cx="120" cy="30" r="6" />
  <circle class="factorial" cx="30" cy="120" r="6" />
  <circle class="factorial" cx="120" cy="120" r="6" />
  <circle class="center" cx="75" cy="75" r="4" />

  <text class="plus" x="150" y="85">+</text>

  <!-- right: star points -->
  <line class="edge" x1="180" y1="75" x2="300" y2="75" />
  <line class="edge" x1="240" y1="15" x2="240" y2="135" />
  <circle class="star" cx="180" cy="75" r="7" transform="rotate(45 180 75)" />
  <circle class="star" cx="300" cy="75" r="7" transform="rotate(45 300 75)" />
  <circle class="star" cx="240" cy="15" r="7" transform="rotate(45 240 15)" />
  <circle class="star" cx="240" cy="135" r="7" transform="rotate(45 240 135)" />
  <circle class="center" cx="240" cy="75" r="4" />

  <text class="plus" x="190" y="175">=</text>

  <!-- combined design -->
  <g transform="translate(0,190)">
    <rect class="edge" x="120" y="30" width="90" height="90" />
    <circle class="circle" cx="165" cy="75" r="80" />
    <circle class="factorial" cx="120" cy="30" r="6" />
    <circle class="factorial" cx="210" cy="30" r="6" />
    <circle class="factorial" cx="120" cy="120" r="6" />
    <circle class="factorial" cx="210" cy="120" r="6" />
    <line class="edge" x1="85" y1="75" x2="245" y2="75" />
    <line class="edge" x1="165" y1="-5" x2="165" y2="155" />
    <circle class="star" cx="85" cy="75" r="7" transform="rotate(45 85 75)" />
    <circle class="star" cx="245" cy="75" r="7" transform="rotate(45 245 75)" />
    <circle class="star" cx="165" cy="-5" r="7" transform="rotate(45 165 -5)" />
    <circle class="star" cx="165" cy="155" r="7" transform="rotate(45 165 155)" />
    <circle class="center" cx="165" cy="75" r="4" />
  </g>
</svg>
