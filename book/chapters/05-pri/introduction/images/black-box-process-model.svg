<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #dfe7ee; stroke: #1B1B1B; stroke-width: 1.5; }
    .title { font-size: 22px; font-weight: bold; fill: #1B1B1B; text-anchor: middle; }
    .arrow { stroke: #1B1B1B; stroke-width: 1.3; fill: none; marker-end: url(#arrowhead); }
    .label { font-size: 14px; font-weight: bold; fill: #00105A; text-anchor: middle; }
    .sublabel { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
    .num { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
    .dots { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1B1B1B" />
    </marker>
  </defs>

  <!-- Process box -->
  <rect class="box" x="230" y="170" width="220" height="220" />
  <text class="title" x="340" y="288">Process</text>

  <!-- Top: uncontrolled, discrete inputs -->
  <text class="label" x="340" y="22">Uncontrolled Inputs</text>
  <text class="label" x="340" y="40">(Co-Factors)</text>

  <line class="arrow" x1="300" y1="55" x2="300" y2="148" />
  <text class="sublabel" x="286" y="102" transform="rotate(-90 286 102)">Different Machines</text>

  <line class="arrow" x1="380" y1="55" x2="380" y2="148" />
  <text class="sublabel" x="366" y="102" transform="rotate(-90 366 102)">Different Operators</text>

  <text class="sublabel" x="340" y="162">Discrete</text>

  <!-- Bottom: uncontrolled, continuous inputs -->
  <line class="arrow" x1="300" y1="530" x2="300" y2="412" />
  <text class="sublabel" x="286" y="471" transform="rotate(-90 286 471)">Temperature</text>

  <line class="arrow" x1="380" y1="530" x2="380" y2="412" />
  <text class="sublabel" x="366" y="471" transform="rotate(-90 366 471)">Humidity</text>

  <text class="sublabel" x="340" y="406">Continuous</text>

  <!-- Left: controlled inputs (factors) -->
  <text class="label" x="90" y="130">Controlled Inputs</text>
  <text class="label" x="90" y="148">(Factors)</text>

  <line class="arrow" x1="100" y1="210" x2="228" y2="210" />
  <text class="num" x="115" y="202">1</text>
  <line class="arrow" x1="100" y1="245" x2="228" y2="245" />
  <text class="num" x="115" y="237">2</text>
  <line class="arrow" x1="100" y1="280" x2="228" y2="280" />
  <text class="num" x="115" y="272">3</text>
  <text class="dots" x="115" y="300">.</text>
  <text class="dots" x="115" y="310">.</text>
  <text class="dots" x="115" y="320">.</text>
  <line class="arrow" x1="100" y1="350" x2="228" y2="350" />
  <text class="num" x="115" y="342">k</text>

  <!-- Right: outputs (responses) -->
  <text class="label" x="595" y="130">Outputs</text>
  <text class="label" x="595" y="148">(Responses)</text>

  <line class="arrow" x1="452" y1="210" x2="580" y2="210" />
  <text class="num" x="565" y="202">1</text>
  <line class="arrow" x1="452" y1="245" x2="580" y2="245" />
  <text class="num" x="565" y="237">2</text>
  <line class="arrow" x1="452" y1="280" x2="580" y2="280" />
  <text class="num" x="565" y="272">3</text>
  <text class="dots" x="565" y="300">.</text>
  <text class="dots" x="565" y="310">.</text>
  <text class="dots" x="565" y="320">.</text>
  <line class="arrow" x1="452" y1="350" x2="580" y2="350" />
  <text class="num" x="565" y="342">r</text>

</svg>
