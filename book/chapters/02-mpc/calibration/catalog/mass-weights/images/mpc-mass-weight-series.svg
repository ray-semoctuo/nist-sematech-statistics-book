<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Helvetica, Arial, sans-serif">
  <style>
    .stage-box { fill: #F2F6FA; stroke: #1B3A52; stroke-width: 1.2; }
    .stage-label { font-size: 15px; font-weight: bold; fill: #00105A; }
    .chip-ref { fill: #36648B; stroke: #1B3A52; stroke-width: 1; }
    .chip-test { fill: #B7DDA6; stroke: #3D6B2E; stroke-width: 1.2; }
    .chip-check { fill: #B7DDA6; stroke: #C0392B; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .chip-text { font-size: 12px; fill: white; text-anchor: middle; }
    .chip-text-dark { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
    .chip-caption { font-size: 11px; fill: #4A4A4A; text-anchor: middle; }
    .arrow { stroke: #4A4A4A; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
    .legend-text { font-size: 12px; fill: #1B1B1B; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A4A4A" />
    </marker>
  </defs>

  <!-- Series 1 -->
  <rect class="stage-box" x="30" y="20" width="640" height="110" rx="8" />
  <text class="stage-label" x="45" y="42">Series 1 -- 1,1,1,1 design</text>

  <rect class="chip-ref" x="60" y="60" width="70" height="40" rx="4" />
  <text class="chip-text" x="95" y="84">1 kg</text>
  <text class="chip-caption" x="95" y="115">reference</text>

  <rect class="chip-ref" x="150" y="60" width="70" height="40" rx="4" />
  <text class="chip-text" x="185" y="84">1 kg</text>
  <text class="chip-caption" x="185" y="115">reference</text>

  <rect class="chip-test" x="240" y="60" width="70" height="40" rx="4" />
  <text class="chip-text-dark" x="275" y="84">1 kg</text>
  <text class="chip-caption" x="275" y="115">test weight</text>

  <text class="legend-text" x="340" y="80">Restraint = average of the two 1 kg reference weights</text>
  <text class="legend-text" x="340" y="100">4th "weight" in this design = the 500+300+200 g group below</text>

  <!-- Arrow 1 -> 2 -->
  <line class="arrow" x1="350" y1="130" x2="350" y2="168" />
  <text class="arrow-label" x="350" y="152" text-anchor="middle" transform="translate(0,-4)">&#931; = 500 + 300 + 200 g becomes the restraint below</text>

  <!-- Series 2 -->
  <rect class="stage-box" x="30" y="180" width="640" height="140" rx="8" />
  <text class="stage-label" x="45" y="202">Series 2 -- 5,3,2,1,1,1 design</text>

  <rect class="chip-ref" x="60" y="220" width="70" height="40" rx="4" />
  <text class="chip-text" x="95" y="244">500 g</text>
  <text class="chip-caption" x="95" y="275">reference</text>

  <rect class="chip-ref" x="150" y="220" width="70" height="40" rx="4" />
  <text class="chip-text" x="185" y="244">300 g</text>
  <text class="chip-caption" x="185" y="275">reference</text>

  <rect class="chip-ref" x="240" y="220" width="70" height="40" rx="4" />
  <text class="chip-text" x="275" y="244">200 g</text>
  <text class="chip-caption" x="275" y="275">reference</text>

  <rect class="chip-test" x="330" y="220" width="70" height="40" rx="4" />
  <text class="chip-text-dark" x="365" y="244">100 g</text>
  <text class="chip-caption" x="365" y="275">test weight</text>

  <rect class="chip-check" x="420" y="220" width="70" height="40" rx="4" />
  <text class="chip-text-dark" x="455" y="244">100 g</text>
  <text class="chip-caption" x="455" y="275">check standard</text>

  <text class="legend-text" x="530" y="238">Restraint = Series 1's</text>
  <text class="legend-text" x="530" y="254">500+300+200 g sum</text>

  <!-- Arrow 2 -> 3 -->
  <line class="arrow" x1="350" y1="320" x2="350" y2="358" />
  <text class="arrow-label" x="350" y="342" text-anchor="middle" transform="translate(0,-4)">&#931; = 50 + 30 + 20 g becomes the restraint below</text>

  <!-- Series 3 -->
  <rect class="stage-box" x="30" y="370" width="640" height="110" rx="8" />
  <text class="stage-label" x="45" y="392">Series 3 -- 1,1,1 design</text>

  <rect class="chip-ref" x="60" y="410" width="70" height="40" rx="4" />
  <text class="chip-text" x="95" y="434">50 g</text>
  <text class="chip-caption" x="95" y="465">reference</text>

  <rect class="chip-ref" x="150" y="410" width="70" height="40" rx="4" />
  <text class="chip-text" x="185" y="434">30 g</text>
  <text class="chip-caption" x="185" y="465">reference</text>

  <rect class="chip-ref" x="240" y="410" width="70" height="40" rx="4" />
  <text class="chip-text" x="275" y="434">20 g</text>
  <text class="chip-caption" x="275" y="465">reference</text>

  <rect class="chip-test" x="330" y="410" width="70" height="40" rx="4" />
  <text class="chip-text-dark" x="365" y="434">10 g</text>
  <text class="chip-caption" x="365" y="465">test weight</text>

  <text class="legend-text" x="440" y="428">Restraint = Series 2's</text>
  <text class="legend-text" x="440" y="444">50+30+20 g sum</text>

  <!-- Legend -->
  <rect x="60" y="495" width="16" height="16" class="chip-ref" />
  <text class="legend-text" x="82" y="508">reference weight (known value)</text>
  <rect x="290" y="495" width="16" height="16" class="chip-test" />
  <text class="legend-text" x="312" y="508">test weight (value assigned)</text>
  <rect x="500" y="495" width="16" height="16" class="chip-check" />
  <text class="legend-text" x="522" y="508">check standard</text>
</svg>
