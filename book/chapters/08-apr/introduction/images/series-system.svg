<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    .wire { stroke: #00105A; stroke-width: 2.5; fill: none; }
    .node { fill: #1B9E77; stroke: #1B1B1B; stroke-width: 1; }
    .label { font-size: 15px; fill: #D60021; text-anchor: middle; }
    .eqn { font-size: 15px; fill: #00105A; text-anchor: middle; }
    .title { font-size: 15px; font-weight: bold; text-decoration: underline; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <text class="title" x="280" y="20">Series System Reduced to Equivalent One Component System</text>

  <!-- Stage 1: five components in series. Top bar with two short legs hanging down (open "n" shape). -->
  <polyline class="wire" points="90,100 90,60 470,60 470,100" />
  <circle class="node" cx="140" cy="60" r="5" />
  <circle class="node" cx="215" cy="60" r="5" />
  <circle class="node" cx="290" cy="60" r="5" />
  <circle class="node" cx="365" cy="60" r="5" />
  <circle class="node" cx="440" cy="60" r="5" />
  <text class="label" x="140" y="45">R1(t)</text>
  <text class="label" x="215" y="45">R2(t)</text>
  <text class="label" x="290" y="45">R3(t)</text>
  <text class="label" x="365" y="45">R4(t)</text>
  <text class="label" x="440" y="45">R5(t)</text>

  <!-- block-style down arrow, centered in the gap between the two diagrams -->
  <polygon points="273,122 287,122 287,158 300,158 280,180 260,158 273,158"
           fill="#1B9E77" stroke="#1B1B1B" stroke-width="1" />

  <!-- Stage 2: equivalent single component. Top bar with legs hanging down, same length as Stage 1. -->
  <polyline class="wire" points="90,255 90,215 470,215 470,255" />
  <circle cx="280" cy="215" r="22" fill="#1B9E77" stroke="#1B1B1B" stroke-width="1.5" />

  <text class="eqn" x="280" y="290">Rs(t) = R1(t) &#215; R2(t) &#215; R3(t) &#215; R4(t) &#215; R5(t)</text>
</svg>
