<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1B1B1B" />
    </marker>
  </defs>
  <style>
    .axis { stroke: #1B1B1B; stroke-width: 1.5; fill: none; }
    .curve { stroke: #1B1B1B; stroke-width: 2; fill: none; }
    .arm { stroke: #1B1B1B; stroke-width: 1.5; fill: none; }
    .construction { stroke: #1B1B1B; stroke-width: 1; fill: none; }
    .gauge { stroke: #1B1B1B; stroke-width: 1; fill: none; }
    .dot { fill: #1B1B1B; }
    .label { font-size: 14px; fill: #1B1B1B; }
    .axis-label { font-size: 14px; fill: #1B1B1B; text-anchor: middle; }
    .tick-label { font-size: 12px; fill: #1B1B1B; text-anchor: middle; }
  </style>

  <!-- coordinate mapping: svg_x = 60 + (x-1)*65 ; svg_y = 370 - (y+4)*20 -->

  <!-- Axes -->
  <line class="axis" x1="60" y1="20" x2="60" y2="370" />
  <line class="axis" x1="60" y1="370" x2="600" y2="370" />

  <!-- x-axis ticks and labels (1 through 8) -->
  <g class="tick-label">
    <line class="axis" x1="60" y1="370" x2="60" y2="376" /><text x="60" y="392">1</text>
    <line class="axis" x1="125" y1="370" x2="125" y2="376" /><text x="125" y="392">2</text>
    <line class="axis" x1="190" y1="370" x2="190" y2="376" /><text x="190" y="392">3</text>
    <line class="axis" x1="255" y1="370" x2="255" y2="376" /><text x="255" y="392">4</text>
    <line class="axis" x1="320" y1="370" x2="320" y2="376" /><text x="320" y="392">5</text>
    <line class="axis" x1="385" y1="370" x2="385" y2="376" /><text x="385" y="392">6</text>
    <line class="axis" x1="450" y1="370" x2="450" y2="376" /><text x="450" y="392">7</text>
    <line class="axis" x1="515" y1="370" x2="515" y2="376" /><text x="515" y="392">8</text>
  </g>

  <!-- Axis titles -->
  <text class="axis-label" x="330" y="414">Sample</text>
  <text class="axis-label" x="20" y="195" transform="rotate(-90 20 195)">Cumulative Sum</text>

  <!-- Data curve: illustrative points at x = 1..7, y = 5, 3, 4, 1, 3.5, 7.8, 4.5 -->
  <!-- Point 6 is drawn above the upper arm (which is at y=7 at x=6), signaling out of control -->
  <polyline class="curve" points="60,190 125,230 190,210 255,270 320,220 385,134 450,200" />
  <circle class="dot" cx="60" cy="190" r="3.5" />
  <circle class="dot" cx="125" cy="230" r="3.5" />
  <circle class="dot" cx="190" cy="210" r="3.5" />
  <circle class="dot" cx="255" cy="270" r="3.5" />
  <circle class="dot" cx="320" cy="220" r="3.5" />
  <circle class="dot" cx="385" cy="134" r="3.5" />
  <circle class="dot" cx="450" cy="200" r="3.5" />

  <!-- Upper and lower arms, both meeting at the Vertex (same height as Origin) -->
  <line class="arm" x1="60" y1="50" x2="547.5" y2="200" />
  <line class="arm" x1="60" y1="350" x2="547.5" y2="200" />

  <!-- Origin and Vertex points -->
  <circle class="dot" cx="450" cy="200" r="3.5" />
  <circle class="dot" cx="547.5" cy="200" r="3.5" />

  <!-- Construction: vertical line from Origin up to the upper arm -->
  <line class="construction" x1="450" y1="200" x2="450" y2="170" />

  <!-- d: horizontal gauge from Origin's x to the Vertex's x -->
  <path d="M 450,243 L 450,253 M 450,248 L 547.5,248 M 547.5,243 L 547.5,253" class="gauge" />
  <text class="label" x="490" y="268" text-anchor="middle">d</text>

  <!-- h: vertical gauge at the Vertex's x, from the Vertex up to the upper arm's height there -->
  <path d="M 560,200 L 570,200 M 565,145 L 565,200 M 560,145 L 570,145" class="gauge" />
  <text class="label" x="595" y="200">h - is the rise in the arm</text>
  <text class="label" x="595" y="218">corresponding to the distance</text>
  <text class="label" x="595" y="236">(d) from origin to vertex</text>

  <!-- k: slope gauge on the lower arm, a 1-unit run with its rise -->
  <path d="M 190,310 L 255,310 M 255,310 L 255,290" class="gauge" />
  <text class="label" x="195" y="325">1 unit</text>
  <text class="label" x="262" y="306">k - is the rise in the arm corresponding to</text>
  <text class="label" x="262" y="324">one sampling unit</text>

  <!-- Callout labels with arrows -->
  <text class="label" x="150" y="75">upper arm</text>
  <path d="M 205,80 L 248,107" stroke="#1B1B1B" stroke-width="1.3" fill="none" marker-end="url(#arrowhead)" />

  <text class="label" x="70" y="310">lower arm</text>
  <path d="M 95,318 L 130,328" stroke="#1B1B1B" stroke-width="1.3" fill="none" marker-end="url(#arrowhead)" />

  <text class="label" x="340" y="235">Origin</text>
  <path d="M 375,228 L 435,205" stroke="#1B1B1B" stroke-width="1.3" fill="none" marker-end="url(#arrowhead)" />

  <text class="label" x="555" y="100">Vertex</text>
  <path d="M 565,110 L 550,185" stroke="#1B1B1B" stroke-width="1.3" fill="none" marker-end="url(#arrowhead)" />
</svg>
