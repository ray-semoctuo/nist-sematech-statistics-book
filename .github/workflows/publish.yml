name: Render and Publish Book

on:
  workflow_dispatch: {}
  # Automatic triggers are disabled until the book's content is further
  # along and Netlify is configured (NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
  # secrets). Re-enable once ready:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore R package library (renv)
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: book

      - name: Render book
        working-directory: book
        run: quarto render

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: book/_book
          production-deploy: ${{ github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
