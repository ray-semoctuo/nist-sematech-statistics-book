[build]
  # The book is rendered by GitHub Actions (see .github/workflows/publish.yml),
  # which deploys the built book/_book/ directory directly. This file exists
  # mainly so Netlify knows the intended publish directory if a manual/CLI
  # deploy is ever run locally.
  publish = "book/_book"
  command = "echo 'Build handled by GitHub Actions; see .github/workflows/publish.yml'"

[build.processing]
  skip_processing = false
